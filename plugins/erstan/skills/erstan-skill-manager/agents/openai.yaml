interface:
  display_name: "Erstan Skill Manager"
  short_description: "Manage reusable Erstan Skill packages"
  default_prompt: "Use $erstan-skill-manager to validate, import, update, or publish this Erstan Skill package."
dependencies:
  tools:
    - type: "mcp"
      value: "erstan"
      description: "Erstan hosted MCP server"
      transport: "streamable_http"
      url: "https://api.erstan.com/v1/mcp"
policy:
  allow_implicit_invocation: true
